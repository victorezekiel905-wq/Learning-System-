name: Deploy database

# Applies new files in supabase/migrations to the production database with the
# Supabase CLI. Runs on pushes to main that change migrations, or by hand.
# Secrets: SUPABASE_ACCESS_TOKEN (supabase.com → Account → Access tokens),
#          SUPABASE_DB_PASSWORD, SUPABASE_PROJECT_REF (e.g. wotevpwomibysehxfvdb)
#
# One-time, for a database created by pasting setup.sql: run this workflow by
# hand with "baseline" ticked. It records the existing migrations as applied
# (nothing is re-run), so later pushes only apply new migrations.
on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:
    inputs:
      baseline:
        description: "First run only: mark all current migrations as already applied"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-db
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::notice::Database deploys are not configured yet (see docs/DEPLOY.md). Skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.cfg.outputs.ready == 'true'
        with:
          version: latest
      - name: Link project
        if: steps.cfg.outputs.ready == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Baseline existing migrations
        if: steps.cfg.outputs.ready == 'true' && inputs.baseline
        run: |
          versions=$(ls supabase/migrations/*.sql | xargs -n1 basename | cut -d_ -f1)
          supabase migration repair --status applied $versions --password "$SUPABASE_DB_PASSWORD"
      - name: Show pending migrations
        if: steps.cfg.outputs.ready == 'true'
        run: supabase migration list --password "$SUPABASE_DB_PASSWORD"
      - name: Apply
        if: steps.cfg.outputs.ready == 'true'
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
