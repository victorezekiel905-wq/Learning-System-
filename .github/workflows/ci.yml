name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: supabase/setup.sql matches the migrations
        run: npm run build:sql && git diff --exit-code supabase/setup.sql
      - name: Type-check
        run: npm run type-check
      - name: Database tests (migrations + RLS + RPCs on PGlite) and unit tests
        run: npm test
      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
          NEXT_PUBLIC_APP_URL: http://localhost:3000
      - name: Dependency audit (production deps)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
