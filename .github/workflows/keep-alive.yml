name: Keep Supabase awake

# The Supabase free tier pauses a project after 7 days without activity.
# This pings it every 3 days. Needs two repository secrets:
#   SUPABASE_URL       e.g. https://abcd1234.supabase.co
#   SUPABASE_ANON_KEY  the public anon key
on:
  schedule:
    - cron: "17 6 */3 * *"   # 06:17 UTC every 3rd day
  workflow_dispatch: {}       # "Run workflow" button for a manual test

permissions:
  contents: read
  actions: write              # lets the job keep this schedule enabled (see last step)

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ping Supabase
        run: node scripts/keep-alive.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      # GitHub switches off scheduled workflows after 60 days with no commits.
      # Re-enabling through the API resets that clock without making commits.
      - name: Keep this schedule enabled
        if: always()
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keep-alive.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
