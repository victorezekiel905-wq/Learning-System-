<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Back to class</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" />
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.5 Inter, system-ui, sans-serif; background: linear-gradient(135deg, #1e1b4b, #164e63); color: #fff; }
    .card { max-width: 480px; padding: 40px; text-align: center; }
    h1 { font: 800 28px/1.2 "Plus Jakarta Sans", Inter, sans-serif; margin: 0 0 12px; }
    a { display: inline-block; margin-top: 20px; padding: 10px 18px; border-radius: 10px; background: #fff; color: #312e81; font-weight: 700; text-decoration: none; }
    p.small { opacity: .7; font-size: 13px; margin-top: 24px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Back to class 👋</h1>
    <p id="reason">Your class session requires you to return to the lesson.</p>
    <a id="back" hidden>Return to the lesson</a>
    <p class="small">This browser is managed by your school during live class sessions. It stops when the session ends.</p>
  </div>
  <script src="blocked.js"></script>
</body>
</html>
