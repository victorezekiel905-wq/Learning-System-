<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>EduClass Fusion Agent</title>
  <style>
    body { width: 320px; margin: 0; padding: 14px; font: 13px/1.4 system-ui, sans-serif; color: #0f172a; background: #f8fafc; }
    h1 { font-size: 14px; margin: 0 0 10px; }
    label { display: block; font-size: 11px; font-weight: 600; color: #64748b; margin: 8px 0 3px; }
    input, select { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 12px; }
    button { margin-top: 10px; width: 100%; padding: 7px; border: 0; border-radius: 6px; background: #1d5ddb; color: #fff; font-weight: 600; cursor: pointer; }
    button.ghost { background: #e2e8f0; color: #334155; }
    #status { margin-top: 10px; font-size: 11px; color: #475569; min-height: 14px; white-space: pre-wrap; }
    .ok { color: #047857; } .err { color: #be123c; }
  </style>
</head>
<body>
  <h1>EduClass Fusion — Classroom Agent</h1>

  <label>Supabase URL</label>
  <input id="url" placeholder="https://xxxx.supabase.co" />

  <label>Supabase anon key</label>
  <input id="anon" placeholder="sb_publishable_..." />

  <label>Device UID (unique per managed device)</label>
  <input id="uid" placeholder="ext-chromebook-001" />

  <label>Session join code (optional pairing)</label>
  <input id="code" placeholder="ABC123" maxlength="6" />

  <button id="save">Save configuration</button>
  <div style="display:flex; gap:6px;">
    <button id="lookup" class="ghost">Pair session</button>
    <button id="test" class="ghost">Test heartbeat</button>
  </div>

  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
