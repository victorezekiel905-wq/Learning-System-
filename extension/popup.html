<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>SwiftCipher Classroom</title>
  <style>
    body { font: 13px/1.45 system-ui, "Segoe UI", sans-serif; width: 320px; margin: 0; color: #0f172a; }
    header { display: flex; align-items: center; gap: 8px; padding: 12px 14px; background: linear-gradient(135deg, #4f46e5, #0891b2); color: #fff; }
    header b { font-size: 15px; }
    main { padding: 12px 14px; }
    label { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase; color: #64748b; margin: 10px 0 4px; }
    input { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 8px; font: inherit; }
    #code { font: 700 20px/1 ui-monospace, monospace; letter-spacing: .25em; text-align: center; text-transform: uppercase; }
    button { margin-top: 12px; width: 100%; padding: 9px; border: 0; border-radius: 8px; background: #4f46e5; color: #fff; font-weight: 600; cursor: pointer; }
    button.secondary { background: #e2e8f0; color: #0f172a; }
    .notice { background: #eef2ff; border: 1px solid #c7d2fe; border-radius: 8px; padding: 8px 10px; margin-top: 10px; }
    .err { color: #be123c; margin-top: 8px; }
    .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
    .live { background: #dcfce7; color: #166534; } .idle { background: #f1f5f9; color: #334155; } .off { background: #ffe4e6; color: #9f1239; }
    .muted { color: #64748b; font-size: 12px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header><b>SwiftCipher</b><span>Classroom</span></header>
  <main>
    <section id="setup" hidden>
      <p>Pair this school browser with your SwiftCipher account.</p>
      <div id="serverRow">
        <label for="server">School server</label>
        <input id="server" placeholder="https://school.swiftcipher.app" />
      </div>
      <label for="code">Pairing code</label>
      <input id="code" maxlength="8" autocomplete="off" />
      <p class="muted">Get a code in SwiftCipher under <b>This device</b>, or ask your teacher.</p>
      <button id="pair">Pair this browser</button>
    </section>

    <section id="paired" hidden>
      <p><b id="student"></b><br /><span class="muted" id="school"></span></p>
      <p>Status: <span id="state" class="pill"></span></p>
      <p id="session" class="muted"></p>
      <div class="notice" id="notice"></div>
      <p class="muted">Nothing is shared when no class session is live. <a id="details" target="_blank">See what's shared</a></p>
      <button class="secondary" id="refresh">Check connection</button>
      <button class="secondary" id="unpair">Remove from this browser</button>
    </section>
    <p class="err" id="err"></p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
